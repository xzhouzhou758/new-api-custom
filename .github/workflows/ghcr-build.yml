name: Build & publish to GHCR

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch or ref to build (e.g. main)"
        required: true
        type: string

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.branch }}

      - name: Resolve tag
        id: v
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "version=$(date +'%Y%m%d')-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/benchu985/new-api-custom:main
            ghcr.io/benchu985/new-api-custom:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
