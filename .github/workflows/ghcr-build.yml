name: Build to GHCR

  on:
    workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
      steps:
        - uses: actions/checkout@v4

        - name: Write VERSION
          run: echo "custom-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)" > VERSION

        - name: Read version
          id: v
          run: echo "tag=$(cat VERSION)" >> "$GITHUB_OUTPUT"

        - uses: docker/setup-buildx-action@v3

        - uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - uses: docker/build-push-action@v6
          with:
            context: .
            platforms: linux/amd64
            push: true
            tags: |
              ghcr.io/xzhouzhou758/new-api-custom:latest
              ghcr.io/xzhouzhou758/new-api-custom:${{ steps.v.outputs.tag }}
            cache-from: type=gha
            cache-to: type=gha,mode=max
